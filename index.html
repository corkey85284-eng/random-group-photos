<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Random Group & Close-ups</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="manifest.json">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #111; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
h1 { font-size: 1.4rem; margin-bottom: 20px; font-weight: 500; }
.controls { width: 100%; max-width: 400px; background: #1e1e1e; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
label { display: block; margin: 12px 0 6px; font-size: 0.9rem; color: #aaa; }
input[type="number"] { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #2a2a2a; color: #fff; font-size: 1rem; }
button { width: 100%; padding: 16px; margin-top: 16px; border: none; border-radius: 12px; background: #007aff; color: #fff; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
button:disabled { background: #444; }
#video-container { width: 100%; max-width: 400px; position: relative; border-radius: 16px; overflow: hidden; background: #000; margin-bottom: 20px; }
video { width: 100%; display: block; }
#status { text-align: center; margin: 10px 0; font-size: 1.1rem; color: #0f0; min-height: 1.4em; font-weight: 600; }
#countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 6rem; font-weight: 700; color: #fff; text-shadow: 0 0 20px #000; z-index: 10; pointer-events: none; }
#complete-banner { display: none; width: 100%; max-width: 400px; background: #34c759; color: #000; text-align: center; padding: 20px; border-radius: 16px; font-size: 1.3rem; font-weight: 700; margin: 10px 0; }
#gallery { width: 100%; max-width: 400px; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-top: 10px; }
#gallery img { width: 100%; border-radius: 8px; }
.download-btn { background: #34c759; margin-top: 8px; font-size: 0.9rem; padding: 10px; display: block; text-align: center; text-decoration: none; color: #fff; border-radius: 8px; }
#startTimerBtn { display: none; width: 100%; max-width: 400px; margin: 10px 0; background: #ff9500; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.1.0/dist/blazeface.min.js"></script>
</head>
<body>
<h1>Random Group & Close-ups</h1>
<div class="controls" id="setup">
  <label for="numGroup">Group photos (full view)</label>
  <input type="number" id="numGroup" min="0" max="20" value="3">
  <label for="numIndividual">Individual close-ups</label>
  <input type="number" id="numIndividual" min="0" max="20" value="4">
  <label for="duration">Total time (minutes)</label>
  <input type="number" id="duration" min="1" max="30" value="2" step="0.5">
  <button id="startBtn">Start Camera</button>
</div>
<div id="video-container" style="display:none;">
  <div id="countdown"></div>
  <video id="video" autoplay playsinline muted></video>
</div>
<button id="startTimerBtn">Start Timer</button>
<div id="status"></div>
<div id="complete-banner">Session Complete! Downloading photos...</div>
<div id="gallery"></div>
<script>
const video = document.getElementById('video');
const startBtn = document.getElementById('startBtn');
const startTimerBtn = document.getElementById('startTimerBtn');
const statusEl = document.getElementById('status');
const gallery = document.getElementById('gallery');
const setup = document.getElementById('setup');
const videoContainer = document.getElementById('video-container');
const countdownEl = document.getElementById('countdown');
const completeBanner = document.getElementById('complete-banner');
let stream = null;
let photos = [];
let schedule = [];
let timeouts = [];
let faceModel = null;
let modelLoading = false;
let sessionParams = null;

async function loadFaceModel() {
  if (faceModel || modelLoading) return;
  modelLoading = true;
  try {
    statusEl.textContent = 'Loading face detection...';
    faceModel = await blazeface.load();
    statusEl.textContent = 'Face detection ready';
  } catch (e) {
    console.error('Face model failed to load', e);
    statusEl.textContent = 'Face detection unavailable (continuing without it)';
  }
  modelLoading = false;
}

loadFaceModel();

startBtn.addEventListener('click', async () => {
  const numGroup = Math.max(0, parseInt(document.getElementById('numGroup').value) || 0);
  const numIndividual = Math.max(0, parseInt(document.getElementById('numIndividual').value) || 0);
  const minutes = Math.max(0.5, parseFloat(document.getElementById('duration').value) || 2);
  const totalDuration = minutes * 60 * 1000;
  const totalShots = numGroup + numIndividual;
  if (totalShots < 1) {
    statusEl.textContent = 'Choose at least one photo';
    return;
  }
  if (!faceModel) await loadFaceModel();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    setup.style.display = 'none';
    videoContainer.style.display = 'block';
    startTimerBtn.style.display = 'block';
    completeBanner.style.display = 'none';
    statusEl.textContent = 'Camera ready — tap Start Timer when everyone is set';
    sessionParams = { numGroup, numIndividual, totalDuration, minutes };
  } catch (err) {
    statusEl.textContent = 'Camera permission denied or unavailable';
    console.error(err);
  }
});

startTimerBtn.addEventListener('click', () => {
  if (!sessionParams) return;
  startTimerBtn.style.display = 'none';
  statusEl.textContent = 'Get ready...';
  startCountdown(15, () => beginSession(sessionParams.numGroup, sessionParams.numIndividual, sessionParams.totalDuration, sessionParams.minutes));
});

function startCountdown(seconds, onDone) {
  let remaining = seconds;
  countdownEl.textContent = remaining;
  countdownEl.style.display = 'block';
  const interval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(interval);
      countdownEl.style.display = 'none';
      statusEl.textContent = 'Starting now!';
      onDone();
    } else {
      countdownEl.textContent = remaining;
    }
  }, 1000);
}

function beginSession(numGroup, numIndividual, totalDuration, minutes) {
  const totalShots = numGroup + numIndividual;
  schedule = [];
  for (let i = 0; i < totalShots; i++) {
    const t = Math.random() * (totalDuration - 2000) + 1000;
    const isGroup = i < numGroup;
    schedule.push({ t, type: isGroup ? 'group' : 'individual' });
  }
  schedule.sort((a, b) => a.t - b.t);
  photos = [];
  gallery.innerHTML = '';
  statusEl.textContent = `Session running — ${numGroup} group + ${numIndividual} close-ups over ${minutes} min`;
  schedule.forEach((item, idx) => {
    const to = setTimeout(() => takePhoto(item.type, idx + 1), item.t);
    timeouts.push(to);
  });
  setTimeout(endSession, totalDuration);
}

async function detectBestFace(vw, vh) {
  if (!faceModel) return null;
  try {
    const predictions = await faceModel.estimateFaces(video, false);
    if (!predictions || predictions.length === 0) return null;
    let best = predictions[0];
    let bestArea = 0;
    for (const p of predictions) {
      const [x1, y1] = p.topLeft;
      const [x2, y2] = p.bottomRight;
      const area = (x2 - x1) * (y2 - y1);
      if (area > bestArea) {
        bestArea = area;
        best = p;
      }
    }
    const [x1, y1] = best.topLeft;
    const [x2, y2] = best.bottomRight;
    return {
      x: x1,
      y: y1,
      width: x2 - x1,
      height: y2 - y1,
      cx: (x1 + x2) / 2,
      cy: (y1 + y2) / 2
    };
  } catch (e) {
    console.warn('Face detection error', e);
    return null;
  }
}

async function takePhoto(type, n) {
  const canvas = document.createElement('canvas');
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  let sx = 0, sy = 0, sw = vw, sh = vh;

  statusEl.textContent = `Capturing ${n}...`;

  if (type === 'individual') {
    const face = await detectBestFace(vw, vh);
    const zoom = 2.0;
    if (face) {
      const pad = 1.6;
      sw = Math.min(vw, face.width * pad * zoom);
      sh = Math.min(vh, face.height * pad * zoom);
      const aspect = vw / vh;
      if (sw / sh > aspect) sh = sw / aspect;
      else sw = sh * aspect;
      sw = Math.min(sw, vw);
      sh = Math.min(sh, vh);
      sx = Math.max(0, Math.min(vw - sw, face.cx - sw / 2));
      sy = Math.max(0, Math.min(vh - sh, face.cy - sh / 2));
    } else {
      sw = vw / zoom;
      sh = vh / zoom;
      sx = Math.random() * (vw - sw);
      sy = Math.random() * (vh - sh);
    }
  }

  const aspect = sw / sh;
  let outW, outH;
  if (type === 'individual') {
    outH = 900;
    outW = Math.round(outH * aspect);
  } else {
    outW = 1400;
    outH = Math.round(outW / aspect);
  }

  canvas.width = outW;
  canvas.height = outH;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

  const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
  photos.push({ url: dataUrl, type });
  const img = document.createElement('img');
  img.src = dataUrl;
  img.title = type === 'group' ? 'Group' : 'Close-up';
  gallery.appendChild(img);
  statusEl.textContent = `Captured ${n}: ${type === 'group' ? 'group' : 'close-up'}`;
  video.style.filter = 'brightness(2)';
  setTimeout(() => video.style.filter = '', 120);
}

function downloadPhoto(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function endSession() {
  timeouts.forEach(clearTimeout);
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  statusEl.textContent = 'All photos captured — downloading...';
  statusEl.style.color = '#34c759';
  completeBanner.style.display = 'block';
  videoContainer.style.display = 'none';
  video.srcObject = null;
  startTimerBtn.style.display = 'none';

  photos.forEach((p, i) => {
    const filename = `${p.type}-${i+1}.jpg`;
    setTimeout(() => downloadPhoto(p.url, filename), i * 600);
    const a = document.createElement('a');
    a.href = p.url;
    a.download = filename;
    a.textContent = `Download ${p.type} ${i+1}`;
    a.className = 'download-btn';
    gallery.parentNode.appendChild(a);
  });

  const again = document.createElement('button');
  again.textContent = 'New Session';
  again.onclick = () => location.reload();
  again.style.marginTop = '20px';
  document.body.appendChild(again);
}
</script>
</body>
</html>
