<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Random Group & Close-ups</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="manifest.json">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #111; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
h1 { font-size: 1.4rem; margin-bottom: 20px; font-weight: 500; }
.controls { width: 100%; max-width: 400px; background: #1e1e1e; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
label { display: block; margin: 12px 0 6px; font-size: 0.9rem; color: #aaa; }
input[type="number"] { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #2a2a2a; color: #fff; font-size: 1rem; }
button { width: 100%; padding: 16px; margin-top: 16px; border: none; border-radius: 12px; background: #007aff; color: #fff; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
button:disabled { background: #444; }
#video-container { width: 100%; max-width: 400px; position: relative; border-radius: 16px; overflow: hidden; background: #000; margin-bottom: 20px; }
video { width: 100%; display: block; }
#status { text-align: center; margin: 10px 0; font-size: 1.1rem; color: #0f0; min-height: 1.4em; font-weight: 600; }
#countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 6rem; font-weight: 700; color: #fff; text-shadow: 0 0 20px #000; z-index: 10; pointer-events: none; }
#complete-banner { display: none; width: 100%; max-width: 400px; background: #34c759; color: #000; text-align: center; padding: 20px; border-radius: 16px; font-size: 1.3rem; font-weight: 700; margin: 10px 0; }
#gallery { width: 100%; max-width: 400px; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-top: 10px; }
#gallery img { width: 100%; border-radius: 8px; }
.download-btn { background: #34c759; margin-top: 8px; font-size: 0.9rem; padding: 10px; display: block; text-align: center; text-decoration: none; color: #fff; border-radius: 8px; }
#startTimerBtn { display: none; width: 100%; max-width: 400px; margin: 10px 0; background: #ff9500; }
</style>
<script src="https://cdn.jsdelivr.net/gh/nenadmarkus/picojs@master/pico.js"></script>
</head>
<body>
<h1>Random Group & Close-ups</h1>
<div class="controls" id="setup">
  <label for="numGroup">Group photos (full view)</label>
  <input type="number" id="numGroup" min="0" max="20" value="3">
  <label for="duration">Total time (minutes)</label>
  <input type="number" id="duration" min="1" max="30" value="2" step="0.5">
  <p style="font-size:0.85rem;color:#aaa;margin-top:8px;">Close-ups: 3 per detected person, spaced evenly</p>
  <button id="startBtn">Start Camera</button>
</div>
<div id="video-container" style="display:none;">
  <div id="countdown"></div>
  <video id="video" autoplay playsinline muted></video>
</div>
<button id="startTimerBtn">Start Timer</button>
<div id="status"></div>
<div id="complete-banner">Session Complete! Downloading photos...</div>
<div id="gallery"></div>
<script>
const video = document.getElementById('video');
const startBtn = document.getElementById('startBtn');
const startTimerBtn = document.getElementById('startTimerBtn');
const statusEl = document.getElementById('status');
const gallery = document.getElementById('gallery');
const setup = document.getElementById('setup');
const videoContainer = document.getElementById('video-container');
const countdownEl = document.getElementById('countdown');
const completeBanner = document.getElementById('complete-banner');
let stream = null;
let photos = [];
let schedule = [];
let timeouts = [];
let facefinder_classify_region = function() { return -1.0; };
let cascadeReady = false;
let sessionParams = null;
let trackedFaces = [];

async function loadCascade() {
  if (cascadeReady) return;
  try {
    statusEl.textContent = 'Loading face detection...';
    const response = await fetch('https://raw.githubusercontent.com/nenadmarkus/pico/master/rnt/cascades/facefinder');
    const buffer = await response.arrayBuffer();
    const bytes = new Int8Array(buffer);
    facefinder_classify_region = pico.unpack_cascade(bytes);
    cascadeReady = true;
    statusEl.textContent = 'Face detection ready';
  } catch (e) {
    console.error('Cascade load failed', e);
    statusEl.textContent = 'Face detection unavailable (continuing without it)';
  }
}

setTimeout(loadCascade, 200);

startBtn.addEventListener('click', async () => {
  const numGroup = Math.max(0, parseInt(document.getElementById('numGroup').value) || 0);
  const minutes = Math.max(0.5, parseFloat(document.getElementById('duration').value) || 2);
  const totalDuration = minutes * 60 * 1000;
  if (numGroup < 0) {
    statusEl.textContent = 'Invalid group count';
    return;
  }
  if (!cascadeReady) await loadCascade();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    setup.style.display = 'none';
    videoContainer.style.display = 'block';
    startTimerBtn.style.display = 'block';
    completeBanner.style.display = 'none';
    statusEl.textContent = cascadeReady
      ? 'Camera ready — tap Start Timer when everyone is set'
      : 'Camera ready (face detection off) — tap Start Timer';
    sessionParams = { numGroup, totalDuration, minutes };
  } catch (err) {
    statusEl.textContent = 'Camera permission denied or unavailable';
    console.error(err);
  }
});

startTimerBtn.addEventListener('click', () => {
  if (!sessionParams) return;
  startTimerBtn.style.display = 'none';
  statusEl.textContent = 'Get ready...';
  startCountdown(15, () => beginSession(sessionParams.numGroup, sessionParams.totalDuration, sessionParams.minutes));
});

function startCountdown(seconds, onDone) {
  let remaining = seconds;
  countdownEl.textContent = remaining;
  countdownEl.style.display = 'block';
  const interval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(interval);
      countdownEl.style.display = 'none';
      statusEl.textContent = 'Starting now!';
      onDone();
    } else {
      countdownEl.textContent = remaining;
    }
  }, 1000);
}

function beginSession(numGroup, totalDuration, minutes) {
  trackedFaces = detectAllFaces();
  const numPeople = trackedFaces.length;
  statusEl.textContent = numPeople > 0
    ? `Detected ${numPeople} person${numPeople>1?'s':''} — scheduling 3 close-ups each`
    : 'No faces detected — group photos only';

  schedule = [];

  if (numGroup > 0) {
    for (let i = 0; i < numGroup; i++) {
      const t = ((i + 0.5) / numGroup) * (totalDuration - 2000) + 1000;
      schedule.push({ t, type: 'group', faceIndex: -1 });
    }
  }

  if (numPeople > 0) {
    for (let p = 0; p < numPeople; p++) {
      for (let shot = 0; shot < 3; shot++) {
        const base = (shot + 0.5) / 3;
        const offset = (p * 0.15) % 0.3;
        const t = (base + offset) * (totalDuration - 3000) + 1500;
        schedule.push({ t, type: 'individual', faceIndex: p });
      }
    }
  }

  schedule.sort((a, b) => a.t - b.t);
  photos = [];
  gallery.innerHTML = '';

  const totalCloseups = numPeople * 3;
  statusEl.textContent = `Session running — ${numGroup} group + ${totalCloseups} close-ups over ${minutes} min`;

  schedule.forEach((item, idx) => {
    const to = setTimeout(() => takePhoto(item.type, item.faceIndex, idx + 1), item.t);
    timeouts.push(to);
  });
  setTimeout(endSession, totalDuration);
}

function rgba_to_grayscale(rgba, nrows, ncols) {
  const gray = new Uint8Array(nrows * ncols);
  for (let r = 0; r < nrows; ++r) {
    for (let c = 0; c < ncols; ++c) {
      const i = (r * ncols + c) * 4;
      gray[r * ncols + c] = (2 * rgba[i] + 7 * rgba[i + 1] + 1 * rgba[i + 2]) / 10;
    }
  }
  return gray;
}

function detectAllFaces() {
  if (!cascadeReady || !video.videoWidth) return [];
  try {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const tmp = document.createElement('canvas');
    tmp.width = Math.min(vw, 640);
    tmp.height = Math.round(tmp.width * (vh / vw));
    const ctx = tmp.getContext('2d');
    ctx.drawImage(video, 0, 0, tmp.width, tmp.height);
    const imageData = ctx.getImageData(0, 0, tmp.width, tmp.height);
    const gray = rgba_to_grayscale(imageData.data, tmp.height, tmp.width);
    const image = { pixels: gray, nrows: tmp.height, ncols: tmp.width, ldim: tmp.width };
    const params = { shiftfactor: 0.1, minsize: 30, maxsize: 800, scalefactor: 1.1 };
    let dets = pico.run_cascade(image, facefinder_classify_region, params);
    dets = pico.cluster_detections(dets, 0.2);
    const qthresh = 5.0;
    const faces = [];
    for (const d of dets) {
      if (d[3] > qthresh) {
        const scaleX = vw / tmp.width;
        const scaleY = vh / tmp.height;
        const cx = d[1] * scaleX;
        const cy = d[0] * scaleY;
        const size = d[2] * Math.max(scaleX, scaleY);
        faces.push({ cx, cy, width: size, height: size, score: d[3] });
      }
    }
    faces.sort((a, b) => b.width - a.width);
    return faces.slice(0, 8);
  } catch (e) {
    console.warn('pico detection error', e);
    return [];
  }
}

async function takePhoto(type, faceIndex, n) {
  const canvas = document.createElement('canvas');
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  let sx = 0, sy = 0, sw = vw, sh = vh;

  statusEl.textContent = `Capturing ${n}...`;

  if (type === 'individual' && faceIndex >= 0 && trackedFaces[faceIndex]) {
    const current = detectAllFaces();
    let face = trackedFaces[faceIndex];
    if (current.length > 0) {
      let bestDist = Infinity;
      for (const f of current) {
        const dist = Math.hypot(f.cx - face.cx, f.cy - face.cy);
        if (dist < bestDist) {
          bestDist = dist;
          face = f;
        }
      }
    }
    const pad = 1.8;
    sw = Math.min(vw, face.width * pad);
    sh = Math.min(vh, face.height * pad);
    const aspect = vw / vh;
    if (sw / sh > aspect) sh = sw / aspect;
    else sw = sh * aspect;
    sw = Math.min(sw, vw);
    sh = Math.min(sh, vh);
    sx = Math.max(0, Math.min(vw - sw, face.cx - sw / 2));
    sy = Math.max(0, Math.min(vh - sh, face.cy - sh / 2));
  } else if (type === 'individual') {
    const zoom = 2.0;
    sw = vw / zoom;
    sh = vh / zoom;
    sx = Math.random() * (vw - sw);
    sy = Math.random() * (vh - sh);
  }

  const aspect = sw / sh;
  let outW, outH;
  if (type === 'individual') {
    outH = 900;
    outW = Math.round(outH * aspect);
  } else {
    outW = 1400;
    outH = Math.round(outW / aspect);
  }

  canvas.width = outW;
  canvas.height = outH;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

  const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
  photos.push({ url: dataUrl, type });
  const img = document.createElement('img');
  img.src = dataUrl;
  img.title = type === 'group' ? 'Group' : 'Close-up';
  gallery.appendChild(img);
  statusEl.textContent = `Captured ${n}: ${type === 'group' ? 'group' : 'close-up'}`;
  video.style.filter = 'brightness(2)';
  setTimeout(() => video.style.filter = '', 120);
}

function downloadPhoto(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function endSession() {
  timeouts.forEach(clearTimeout);
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  statusEl.textContent = 'All photos captured — downloading...';
  statusEl.style.color = '#34c759';
  completeBanner.style.display = 'block';
  videoContainer.style.display = 'none';
  video.srcObject = null;
  startTimerBtn.style.display = 'none';

  photos.forEach((p, i) => {
    const filename = `${p.type}-${i+1}.jpg`;
    setTimeout(() => downloadPhoto(p.url, filename), i * 600);
    const a = document.createElement('a');
    a.href = p.url;
    a.download = filename;
    a.textContent = `Download ${p.type} ${i+1}`;
    a.className = 'download-btn';
    gallery.parentNode.appendChild(a);
  });

  const again = document.createElement('button');
  again.textContent = 'New Session';
  again.onclick = () => location.reload();
  again.style.marginTop = '20px';
  document.body.appendChild(again);
}
</script>
</body>
</html>
