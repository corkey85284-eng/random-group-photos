<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Group Capture</title>
<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href="manifest.json">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: #0a0a0a;
  color: #f5f5f5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px;
  line-height: 1.4;
}
.header {
  text-align: center;
  margin-bottom: 28px;
  width: 100%;
  max-width: 420px;
}
.header h1 {
  font-size: 1.65rem;
  font-weight: 600;
  letter-spacing: -0.3px;
  margin-bottom: 4px;
}
.header p {
  font-size: 0.85rem;
  color: #888;
  font-weight: 400;
}
.card {
  width: 100%;
  max-width: 420px;
  background: #161616;
  border: 1px solid #2a2a2a;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}
label {
  display: block;
  margin: 14px 0 6px;
  font-size: 0.82rem;
  color: #aaa;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
input[type="number"] {
  width: 100%;
  padding: 14px 12px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #1c1c1c;
  color: #fff;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.15s;
}
input[type="number"]:focus {
  border-color: #0a84ff;
}
.note {
  font-size: 0.8rem;
  color: #777;
  margin-top: 12px;
  line-height: 1.45;
}
button {
  width: 100%;
  padding: 16px;
  margin-top: 18px;
  border: none;
  border-radius: 12px;
  background: #0a84ff;
  color: #fff;
  font-size: 1.05rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
button:active { transform: scale(0.98); }
button:disabled { background: #333; color: #666; }
#startTimerBtn {
  display: none;
  background: #ff9f0a;
  margin: 12px 0 8px;
}
#video-container {
  width: 100%;
  max-width: 420px;
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  background: #000;
  margin-bottom: 16px;
  border: 1px solid #222;
}
video { width: 100%; display: block; }
#status {
  text-align: center;
  margin: 12px 0;
  font-size: 0.95rem;
  color: #30d158;
  min-height: 1.4em;
  font-weight: 500;
  max-width: 420px;
}
#countdown {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 7rem;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 4px 24px rgba(0,0,0,0.6);
  z-index: 10;
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
#complete-banner {
  display: none;
  width: 100%;
  max-width: 420px;
  background: #30d158;
  color: #000;
  text-align: center;
  padding: 18px 16px;
  border-radius: 14px;
  font-size: 1.15rem;
  font-weight: 600;
  margin: 12px 0;
}
#gallery {
  width: 100%;
  max-width: 420px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 10px;
  margin-top: 16px;
}
#gallery img {
  width: 100%;
  border-radius: 10px;
  border: 1px solid #222;
}
.download-btn {
  background: #30d158;
  margin-top: 8px;
  font-size: 0.85rem;
  padding: 10px;
  display: block;
  text-align: center;
  text-decoration: none;
  color: #000;
  border-radius: 8px;
  font-weight: 500;
}
</style>
<script src="https://cdn.jsdelivr.net/gh/nenadmarkus/picojs@master/pico.js"></script>
</head>
<body>
<div class="header">
  <h1>Group Capture</h1>
  <p>Automated photos & videos</p>
</div>

<div class="card" id="setup">
  <label for="numGroup">Group Photos</label>
  <input type="number" id="numGroup" min="0" max="20" value="3">
  <label for="duration">Session Length (minutes)</label>
  <input type="number" id="duration" min="1" max="30" value="3" step="0.5">
  <p class="note">Detects people at start. Per person: 3 close-up photos + 3 videos (2 close-up, 1 full-body), 15s each, evenly spaced.</p>
  <button id="startBtn">Start Camera</button>
</div>

<div id="video-container" style="display:none;">
  <div id="countdown"></div>
  <video id="video" autoplay playsinline muted></video>
</div>
<button id="startTimerBtn">Start Session</button>
<div id="status"></div>
<div id="complete-banner">Session complete — saving files</div>
<div id="gallery"></div>
<script>
const video = document.getElementById('video');
const startBtn = document.getElementById('startBtn');
const startTimerBtn = document.getElementById('startTimerBtn');
const statusEl = document.getElementById('status');
const gallery = document.getElementById('gallery');
const setup = document.getElementById('setup');
const videoContainer = document.getElementById('video-container');
const countdownEl = document.getElementById('countdown');
const completeBanner = document.getElementById('complete-banner');
let stream = null;
let photos = [];
let schedule = [];
let timeouts = [];
let facefinder_classify_region = function() { return -1.0; };
let cascadeReady = false;
let sessionParams = null;
let trackedFaces = [];
let videoClips = [];

async function loadCascade() {
  if (cascadeReady) return;
  try {
    statusEl.textContent = 'Preparing face detection…';
    const response = await fetch('https://raw.githubusercontent.com/nenadmarkus/pico/master/rnt/cascades/facefinder');
    const buffer = await response.arrayBuffer();
    const bytes = new Int8Array(buffer);
    facefinder_classify_region = pico.unpack_cascade(bytes);
    cascadeReady = true;
    statusEl.textContent = 'Ready';
  } catch (e) {
    console.error('Cascade load failed', e);
    statusEl.textContent = 'Face detection unavailable';
  }
}

setTimeout(loadCascade, 200);

startBtn.addEventListener('click', async () => {
  const numGroup = Math.max(0, parseInt(document.getElementById('numGroup').value) || 0);
  const minutes = Math.max(0.5, parseFloat(document.getElementById('duration').value) || 3);
  const totalDuration = minutes * 60 * 1000;
  if (!cascadeReady) await loadCascade();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    setup.style.display = 'none';
    videoContainer.style.display = 'block';
    startTimerBtn.style.display = 'block';
    completeBanner.style.display = 'none';
    statusEl.textContent = cascadeReady ? 'Camera ready — tap Start Session when set' : 'Camera ready (no face detection)';
    sessionParams = { numGroup, totalDuration, minutes };
  } catch (err) {
    statusEl.textContent = 'Camera permission denied';
    console.error(err);
  }
});

startTimerBtn.addEventListener('click', () => {
  if (!sessionParams) return;
  startTimerBtn.style.display = 'none';
  statusEl.textContent = 'Get ready…';
  startCountdown(15, () => beginSession(sessionParams.numGroup, sessionParams.totalDuration, sessionParams.minutes));
});

function startCountdown(seconds, onDone) {
  let remaining = seconds;
  countdownEl.textContent = remaining;
  countdownEl.style.display = 'block';
  const interval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(interval);
      countdownEl.style.display = 'none';
      statusEl.textContent = 'Session started';
      onDone();
    } else {
      countdownEl.textContent = remaining;
    }
  }, 1000);
}

function beginSession(numGroup, totalDuration, minutes) {
  trackedFaces = detectAllFaces();
  const numPeople = trackedFaces.length;
  statusEl.textContent = numPeople > 0
    ? `Detected ${numPeople} person${numPeople>1?'s':''}`
    : 'No faces detected';

  schedule = [];
  videoClips = [];

  if (numGroup > 0) {
    for (let i = 0; i < numGroup; i++) {
      const t = ((i + 0.5) / numGroup) * (totalDuration - 2000) + 1000;
      schedule.push({ t, type: 'group', faceIndex: -1 });
    }
  }

  if (numPeople > 0) {
    for (let p = 0; p < numPeople; p++) {
      for (let shot = 0; shot < 3; shot++) {
        const base = (shot + 0.5) / 3;
        const offset = (p * 0.12) % 0.25;
        const t = (base + offset) * (totalDuration - 4000) + 2000;
        schedule.push({ t, type: 'individual', faceIndex: p });
      }
    }
  }

  if (numPeople > 0) {
    const videoSlots = [];
    for (let p = 0; p < numPeople; p++) {
      videoSlots.push({ faceIndex: p, mode: 'closeup' });
      videoSlots.push({ faceIndex: p, mode: 'closeup' });
      videoSlots.push({ faceIndex: p, mode: 'full' });
    }
    videoSlots.sort((a, b) => (a.faceIndex - b.faceIndex) || (a.mode === 'full' ? 1 : -1));

    const videoDuration = 15000;
    const usable = Math.max(totalDuration - videoDuration - 2000, 10000);
    for (let i = 0; i < videoSlots.length; i++) {
      const t = ((i + 0.5) / videoSlots.length) * usable + 1000;
      schedule.push({
        t,
        type: 'video',
        faceIndex: videoSlots[i].faceIndex,
        mode: videoSlots[i].mode
      });
    }
  }

  schedule.sort((a, b) => a.t - b.t);
  photos = [];
  gallery.innerHTML = '';

  const totalCloseups = numPeople * 3;
  const totalVideos = numPeople * 3;
  statusEl.textContent = `${numGroup} group · ${totalCloseups} close-ups · ${totalVideos} videos`;

  schedule.forEach((item, idx) => {
    if (item.type === 'video') {
      const to = setTimeout(() => startVideoClip(item.faceIndex, item.mode, idx + 1), item.t);
      timeouts.push(to);
    } else {
      const to = setTimeout(() => takePhoto(item.type, item.faceIndex, idx + 1), item.t);
      timeouts.push(to);
    }
  });
  setTimeout(endSession, totalDuration);
}

function rgba_to_grayscale(rgba, nrows, ncols) {
  const gray = new Uint8Array(nrows * ncols);
  for (let r = 0; r < nrows; ++r) {
    for (let c = 0; c < ncols; ++c) {
      const i = (r * ncols + c) * 4;
      gray[r * ncols + c] = (2 * rgba[i] + 7 * rgba[i + 1] + 1 * rgba[i + 2]) / 10;
    }
  }
  return gray;
}

function detectAllFaces() {
  if (!cascadeReady || !video.videoWidth) return [];
  try {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const tmp = document.createElement('canvas');
    tmp.width = Math.min(vw, 640);
    tmp.height = Math.round(tmp.width * (vh / vw));
    const ctx = tmp.getContext('2d');
    ctx.drawImage(video, 0, 0, tmp.width, tmp.height);
    const imageData = ctx.getImageData(0, 0, tmp.width, tmp.height);
    const gray = rgba_to_grayscale(imageData.data, tmp.height, tmp.width);
    const image = { pixels: gray, nrows: tmp.height, ncols: tmp.width, ldim: tmp.width };
    const params = { shiftfactor: 0.1, minsize: 30, maxsize: 800, scalefactor: 1.1 };
    let dets = pico.run_cascade(image, facefinder_classify_region, params);
    dets = pico.cluster_detections(dets, 0.2);
    const qthresh = 5.0;
    const faces = [];
    for (const d of dets) {
      if (d[3] > qthresh) {
        const scaleX = vw / tmp.width;
        const scaleY = vh / tmp.height;
        const cx = d[1] * scaleX;
        const cy = d[0] * scaleY;
        const size = d[2] * Math.max(scaleX, scaleY);
        faces.push({ cx, cy, width: size, height: size, score: d[3] });
      }
    }
    faces.sort((a, b) => b.width - a.width);
    return faces.slice(0, 6);
  } catch (e) {
    console.warn('pico detection error', e);
    return [];
  }
}

function getFaceForIndex(faceIndex) {
  if (faceIndex < 0 || !trackedFaces[faceIndex]) return null;
  const current = detectAllFaces();
  let face = trackedFaces[faceIndex];
  if (current.length > 0) {
    let bestDist = Infinity;
    for (const f of current) {
      const dist = Math.hypot(f.cx - face.cx, f.cy - face.cy);
      if (dist < bestDist) {
        bestDist = dist;
        face = f;
      }
    }
  }
  return face;
}

async function takePhoto(type, faceIndex, n) {
  const canvas = document.createElement('canvas');
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  let sx = 0, sy = 0, sw = vw, sh = vh;

  statusEl.textContent = `Photo ${n}`;

  if (type === 'individual') {
    const face = getFaceForIndex(faceIndex);
    if (face) {
      const pad = 1.8;
      sw = Math.min(vw, face.width * pad);
      sh = Math.min(vh, face.height * pad);
      const aspect = vw / vh;
      if (sw / sh > aspect) sh = sw / aspect;
      else sw = sh * aspect;
      sw = Math.min(sw, vw);
      sh = Math.min(sh, vh);
      sx = Math.max(0, Math.min(vw - sw, face.cx - sw / 2));
      sy = Math.max(0, Math.min(vh - sh, face.cy - sh / 2));
    } else {
      const zoom = 2.0;
      sw = vw / zoom;
      sh = vh / zoom;
      sx = Math.random() * (vw - sw);
      sy = Math.random() * (vh - sh);
    }
  }

  const aspect = sw / sh;
  let outW, outH;
  if (type === 'individual') {
    outH = 900;
    outW = Math.round(outH * aspect);
  } else {
    outW = 1400;
    outH = Math.round(outW / aspect);
  }

  canvas.width = outW;
  canvas.height = outH;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

  const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
  photos.push({ url: dataUrl, type: 'photo-' + type });
  const img = document.createElement('img');
  img.src = dataUrl;
  img.title = type === 'group' ? 'Group' : 'Close-up';
  gallery.appendChild(img);
  video.style.filter = 'brightness(1.8)';
  setTimeout(() => video.style.filter = '', 100);
}

async function startVideoClip(faceIndex, mode, n) {
  statusEl.textContent = `Video ${n} · ${mode}`;
  const isCloseup = mode === 'closeup';
  let recordStream = stream;
  let canvas = null;
  let animId = null;

  if (isCloseup) {
    canvas = document.createElement('canvas');
    const face = getFaceForIndex(faceIndex) || { cx: video.videoWidth/2, cy: video.videoHeight/2, width: video.videoWidth/2, height: video.videoHeight/2 };
    const pad = 1.6;
    let sw = Math.min(video.videoWidth, face.width * pad);
    let sh = Math.min(video.videoHeight, face.height * pad);
    const aspect = video.videoWidth / video.videoHeight;
    if (sw / sh > aspect) sh = sw / aspect;
    else sw = sh * aspect;
    const sx = Math.max(0, Math.min(video.videoWidth - sw, face.cx - sw / 2));
    const sy = Math.max(0, Math.min(video.videoHeight - sh, face.cy - sh / 2));

    canvas.width = 720;
    canvas.height = Math.round(720 * (sh / sw));
    const ctx = canvas.getContext('2d');

    function draw() {
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      animId = requestAnimationFrame(draw);
    }
    draw();
    recordStream = canvas.captureStream(15);
  }

  try {
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' :
                 MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : 'video/mp4';
    const recorder = new MediaRecorder(recordStream, { mimeType: mime });
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      if (animId) cancelAnimationFrame(animId);
      const blob = new Blob(chunks, { type: mime });
      const url = URL.createObjectURL(blob);
      videoClips.push({ url, type: `video-${mode}-p${faceIndex+1}`, mime });
      statusEl.textContent = `Video ${n} saved`;
      setTimeout(() => {
        const a = document.createElement('a');
        a.href = url;
        a.download = `video-${mode}-person${faceIndex+1}-${n}.${mime.includes('mp4') ? 'mp4' : 'webm'}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }, 300);
    };
    recorder.start();
    setTimeout(() => {
      if (recorder.state === 'recording') recorder.stop();
    }, 15000);
  } catch (e) {
    console.error('Video record failed', e);
    statusEl.textContent = 'Video recording failed';
    if (animId) cancelAnimationFrame(animId);
  }
}

function downloadPhoto(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function endSession() {
  timeouts.forEach(clearTimeout);
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  statusEl.textContent = 'Complete';
  statusEl.style.color = '#30d158';
  completeBanner.style.display = 'block';
  videoContainer.style.display = 'none';
  video.srcObject = null;
  startTimerBtn.style.display = 'none';

  photos.forEach((p, i) => {
    const filename = `${p.type}-${i+1}.jpg`;
    setTimeout(() => downloadPhoto(p.url, filename), i * 500);
    const a = document.createElement('a');
    a.href = p.url;
    a.download = filename;
    a.textContent = `Save ${p.type} ${i+1}`;
    a.className = 'download-btn';
    gallery.parentNode.appendChild(a);
  });

  const again = document.createElement('button');
  again.textContent = 'New Session';
  again.onclick = () => location.reload();
  again.style.marginTop = '20px';
  again.style.background = '#1c1c1c';
  again.style.border = '1px solid #333';
  document.body.appendChild(again);
}
</script>
</body>
</html>
